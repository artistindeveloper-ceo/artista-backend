# Spring Application
spring.application.name=artistin-backend
#spring.profiles.active=prod

# Multipart Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# Server Configuration
server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always


spring.datasource.url=jdbc:postgresql://43.205.146.248:5432/artistin_db
spring.datasource.username=postgres
spring.datasource.password=artist@123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Ensure you have the dependency in pom.xml or build.gradle

# JamConnect JWT Configuration
artist_in.jwt.secret=${JAMCONNECT_JWT_SECRET:c2hhbmUtZ2l2ZS10aGlzLWEtcmVhbC1zZWNyZXQtaW4tcHJvZHVjdGlvbi1wbGVhc2UtY2hhbmdlLW1l}
artist_in.jwt.access-token-expiration-ms=900000
